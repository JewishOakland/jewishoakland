# Runs the TV screen's tests on every push that touches it. The screen itself is uploaded to jewishoakland.org/tv/ by hand (see tv/README.md).
name: TV screen

on:
  push:
    paths:
      - 'tv/**'
      - '.github/workflows/tv-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the feed tests
        run: node --test tv/tests/*.test.js
